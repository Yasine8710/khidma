name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Goldens are OS-specific; run them locally (see gallery_golden_test.dart).
      - run: flutter test --exclude-tags golden
      - run: flutter build web --release
  backend:
    # Migrations and Row Level Security tests on real Postgres (PGlite/WASM).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
  ios-build:
    # Unsigned compile check only (no signing identity yet). Allowed to fail
    # until it has been seen green once on a real runner.
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
