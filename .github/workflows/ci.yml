name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  secrets:
    # Secret scan of the whole history (config and allowlist in .gitleaks.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Goldens are OS-specific; run them locally (see gallery_golden_test.dart).
      - run: flutter test --exclude-tags golden
      - run: flutter build web --release
  backend:
    # Migrations and Row Level Security tests on real Postgres (PGlite/WASM).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
  admin:
    # Admin dashboard: type check, unit tests, production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  ios-build:
    # Unsigned compile check only (no signing identity yet). Allowed to fail
    # until it has been seen green once on a real runner.
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Keeps geolocator's always-authorization code out of the binary (we
      # only use when-in-use). Whether SwiftPM honours it must be checked on
      # the release build (docs/SECURITY.md, owner checklist).
      - run: BYPASS_PERMISSION_LOCATION_ALWAYS=1 flutter build ios --release --no-codesign
  android-build:
    # Compile check only (release signing is configured before distribution).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
